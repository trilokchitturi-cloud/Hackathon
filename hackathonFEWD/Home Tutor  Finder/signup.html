<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Sign Up - TutorFinder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Navbar -->
  <header class="navbar">
    <a href="index.html" class="brand">🎓 TutorFinder</a>
    <a href="index.html" class="nav-link">← Back to Home</a>
  </header>

  <div class="container" style="max-width: 460px; margin: auto;">
    <div style="background: #fff; padding: 2rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow);">
      <h2 style="text-align: center; margin-bottom: 0.5rem;" id="formTitle">Welcome to TutorFinder</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Create an account or login to continue</p>

      <!-- Hackathon Judge 1-Click Fast Login -->
      <div style="background: var(--primary-light); border: 1px dashed var(--primary); padding: 0.9rem; border-radius: 10px; margin-bottom: 1.5rem;">
        <div style="font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem;">
          ⚡ HACKATHON DEMO: Quick Login
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" class="btn btn-outline btn-sm" style="flex: 1; background: #fff;" onclick="quickLogin('student')">👤 Student</button>
          <button type="button" class="btn btn-outline btn-sm" style="flex: 1; background: #fff;" onclick="quickLogin('tutor')">👨‍🏫 Tutor</button>
          <button type="button" class="btn btn-outline btn-sm" style="flex: 1; background: #fff;" onclick="quickLogin('admin')">🔑 Admin</button>
        </div>
      </div>

      <!-- Role Selection -->
      <div class="form-group">
        <label>I am registering as:</label>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" id="roleStudent" class="btn btn-outline btn-sm" style="flex: 1; border-color: var(--primary); color: var(--primary);" onclick="setRole('Student')">Student / Parent</button>
          <button type="button" id="roleTutor" class="btn btn-outline btn-sm" style="flex: 1;" onclick="setRole('Tutor')">Tutor</button>
        </div>
      </div>

      <form onsubmit="handleAuth(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="authName" placeholder="e.g. Ramesh Kumar" required />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="authEmail" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <label>City / Location</label>
          <input type="text" id="authCity" placeholder="e.g. Bangalore, Delhi, Pune" required />
        </div>

        <div class="form-group" id="tutorSubjectGroup" style="display: none;">
          <label>Subjects You Can Teach</label>
          <input type="text" id="authSubjects" placeholder="e.g. Mathematics, Physics, Chemistry" />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    let currentRole = 'Student';

    function setRole(role) {
      currentRole = role;
      document.getElementById('roleStudent').style.borderColor = role === 'Student' ? 'var(--primary)' : 'var(--border)';
      document.getElementById('roleStudent').style.color = role === 'Student' ? 'var(--primary)' : 'var(--text-dark)';

      document.getElementById('roleTutor').style.borderColor = role === 'Tutor' ? 'var(--primary)' : 'var(--border)';
      document.getElementById('roleTutor').style.color = role === 'Tutor' ? 'var(--primary)' : 'var(--text-dark)';

      document.getElementById('tutorSubjectGroup').style.display = role === 'Tutor' ? 'block' : 'none';
    }

    function quickLogin(role) {
      if (role === 'admin') {
        localStorage.setItem('htf_current_user', JSON.stringify({ name: 'Admin Master', role: 'admin' }));
        window.location.href = 'admin.html';
      } else if (role === 'tutor') {
        localStorage.setItem('htf_current_user', JSON.stringify({ name: 'Dr. Rajesh Verma', role: 'tutor' }));
        window.location.href = 'user.html';
      } else {
        localStorage.setItem('htf_current_user', JSON.stringify({ name: 'Aarav Sharma', role: 'student' }));
        window.location.href = 'user.html';
      }
    }
